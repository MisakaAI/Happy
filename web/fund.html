<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金净值</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.39/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; color: #f8f7ff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(circle at 12% 9%, #583f91 0, transparent 35%), linear-gradient(145deg, #1e1c39, #293a5c 62%, #1d4f58); }
        nav { position: fixed; z-index: 10; top: 18px; left: 50%; display: flex; gap: 6px; padding: 6px; transform: translateX(-50%); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; background: rgba(20,18,44,.58); backdrop-filter: blur(14px); }
        nav a { padding: 8px 14px; color: rgba(255,255,255,.67); font-size: 13px; text-decoration: none; border-radius: 999px; } nav a.active, nav a:hover { color: #fff; background: rgba(255,255,255,.14); }
        #app { width: min(1050px, 100%); min-height: 100vh; margin: auto; padding: 96px 24px 42px; } header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; } h1 { font-size: clamp(29px, 5vw, 46px); letter-spacing: -.04em; } .muted { color: rgba(255,255,255,.53); font-size: 13px; }
        select { max-width: 420px; padding: 11px 14px; color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 12px; outline: none; background: #35375c; }
        .panel { border: 1px solid rgba(255,255,255,.14); border-radius: 22px; background: rgba(255,255,255,.08); box-shadow: 0 18px 45px rgba(0,0,0,.2); backdrop-filter: blur(14px); }
        .hero { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 30px; padding: 28px; } .name { max-width: 650px; margin-bottom: 8px; font-size: clamp(19px, 3vw, 27px); font-weight: 650; } .meta { display: flex; flex-wrap: wrap; gap: 15px; color: rgba(255,255,255,.52); font-size: 12px; }
        .nav-value { color: #85ead1; font-size: clamp(44px, 8vw, 65px); font-weight: 700; line-height: 1; text-align: right; } .nav-label { margin-top: 8px; color: rgba(255,255,255,.5); font-size: 12px; text-align: right; }
        .chart { height: 420px; margin-top: 22px; padding: 12px; } .cards-title { margin: 30px 0 12px; color: rgba(255,255,255,.58); font-size: 14px; } .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 12px; }
        .fund-card { padding: 17px; cursor: pointer; transition: .18s; } .fund-card:hover, .fund-card.selected { transform: translateY(-2px); background: rgba(255,255,255,.14); } .fund-card .card-name { height: 38px; overflow: hidden; font-size: 14px; line-height: 1.4; } .fund-card strong { display: block; margin: 13px 0 4px; color: #85ead1; font-size: 23px; }
        .empty { padding: 55px; color: rgba(255,255,255,.55); text-align: center; }
        @media (max-width: 700px) { nav a { padding: 7px 9px; } #app { padding-inline: 15px; } header { align-items: stretch; flex-direction: column; } .hero { grid-template-columns: 1fr; } .nav-value, .nav-label { text-align: left; } .chart { height: 340px; } }
    </style>
</head>

<body>
    <nav><a href="/weather">天气</a><a href="/fx">外汇</a><a class="active" href="/fund">基金</a><a href="/gold">黄金</a></nav>
    <div id="app">
        <header><div><h1>基金净值</h1><div class="muted">每日净值归档 · 最近 180 天走势</div></div><select v-model="selectedCode"><option v-for="item in latestRows" :key="item.code" :value="item.code">{{ item.code }} · {{ item.name }}</option></select></header>
        <template v-if="selected">
            <section class="panel hero"><div><div class="name">{{ selected.name }}</div><div class="meta"><span>代码 {{ selected.code }}</span><span>管理人 {{ selected.manager || '--' }}</span><span>净值日期 {{ selected.nav_date }}</span></div></div><div><div class="nav-value">{{ number(selected.net_value) }}</div><div class="nav-label">单位净值</div></div></section>
            <div id="fundChart" class="panel chart"></div>
            <div class="cards-title">全部基金</div><div class="cards"><div v-for="item in latestRows" :key="item.code" class="panel fund-card" :class="{ selected: item.code === selectedCode }" @click="selectedCode = item.code"><div class="card-name">{{ item.name }}</div><strong>{{ number(item.net_value) }}</strong><div class="muted">{{ item.code }} · {{ item.nav_date }}</div></div></div>
        </template>
        <div v-else class="panel empty">{{ error || '暂无基金数据' }}</div>
    </div>
    <script>
        const { createApp, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;
        createApp({ setup() {
            const latestRows = ref([]), historyRows = ref([]), selectedCode = ref(''), error = ref(''); let chart = null;
            const selected = computed(() => latestRows.value.find(row => row.code === selectedCode.value) || latestRows.value[0]);
            const number = value => value == null ? '--' : Number(value).toFixed(4);
            function render() { if (!chart) return; const rows = historyRows.value.filter(row => row.code === selectedCode.value); chart.setOption({ title: { text: `${selectedCode.value} 净值走势`, left: 'center', textStyle: { color: '#f8f7ff', fontSize: 16 } }, tooltip: { trigger: 'axis', valueFormatter: value => Number(value).toFixed(4) }, grid: { left: 62, right: 24, top: 52, bottom: 42 }, xAxis: { type: 'category', boundaryGap: false, data: rows.map(row => row.nav_date.slice(5)), axisLabel: { color: 'rgba(255,255,255,.53)' }, axisLine: { lineStyle: { color: 'rgba(255,255,255,.18)' } } }, yAxis: { type: 'value', scale: true, axisLabel: { color: 'rgba(255,255,255,.53)' }, splitLine: { lineStyle: { color: 'rgba(255,255,255,.1)' } } }, series: [{ name: '单位净值', type: 'line', smooth: true, showSymbol: false, data: rows.map(row => row.net_value), lineStyle: { width: 3, color: '#75dfc4' }, areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(117,223,196,.35)' }, { offset: 1, color: 'rgba(117,223,196,0)' }] } } }] }, true); }
            async function load() { try { const [a, b] = await Promise.all([fetch('/fund/now'), fetch('/fund/recent?days=180')]); if (!a.ok || !b.ok) throw new Error('接口请求失败'); latestRows.value = await a.json(); historyRows.value = await b.json(); if (!latestRows.value.some(row => row.code === selectedCode.value) && latestRows.value.length) selectedCode.value = latestRows.value[0].code; error.value = ''; await nextTick(); if (!chart) chart = echarts.init(document.getElementById('fundChart')); render(); } catch (e) { error.value = `加载失败：${e.message}`; } }
            watch(selectedCode, render); const resize = () => chart && chart.resize(); onMounted(async () => { window.addEventListener('resize', resize); await load(); }); onBeforeUnmount(() => { window.removeEventListener('resize', resize); chart && chart.dispose(); });
            return { latestRows, selectedCode, selected, error, number };
        }}).mount('#app');
    </script>
</body>
</html>

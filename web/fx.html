<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时外汇汇率</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.39/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; color: #f7fbff; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(circle at 15% 10%, #287a78 0, transparent 35%), linear-gradient(135deg, #102d3b, #18233d 65%, #252044); }
        nav { position: fixed; z-index: 10; top: 18px; left: 50%; display: flex; gap: 6px; padding: 6px; transform: translateX(-50%); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; background: rgba(8,20,35,.55); backdrop-filter: blur(14px); }
        nav a { padding: 8px 14px; color: rgba(255,255,255,.7); font-size: 13px; text-decoration: none; border-radius: 999px; }
        nav a.active, nav a:hover { color: #fff; background: rgba(255,255,255,.14); }
        #app { width: min(1100px, 100%); min-height: 100vh; margin: auto; padding: 96px 24px 40px; }
        header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
        h1 { font-size: clamp(28px, 5vw, 46px); letter-spacing: -.04em; }
        .sub { margin-top: 7px; color: rgba(255,255,255,.58); font-size: 13px; }
        select { min-width: 170px; padding: 11px 14px; color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 12px; outline: none; background: #20334a; }
        .panel { border: 1px solid rgba(255,255,255,.14); border-radius: 22px; background: rgba(255,255,255,.08); box-shadow: 0 18px 45px rgba(0,0,0,.2); backdrop-filter: blur(14px); }
        .hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; padding: 25px; }
        .hero-name { color: rgba(255,255,255,.62); font-size: 14px; }
        .hero-code { margin: 5px 0 16px; font-size: 31px; font-weight: 700; }
        .updated { color: rgba(255,255,255,.48); font-size: 12px; }
        .quotes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .quote { padding: 14px; border-radius: 14px; background: rgba(255,255,255,.075); }
        .quote strong { display: block; font-size: 20px; }
        .quote span { color: rgba(255,255,255,.5); font-size: 11px; }
        .chart { height: 390px; margin-top: 22px; padding: 12px; }
        .list-title { margin: 30px 0 13px; font-size: 14px; color: rgba(255,255,255,.65); }
        .currency-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .currency { padding: 16px; cursor: pointer; transition: transform .18s, background .18s; }
        .currency:hover, .currency.selected { transform: translateY(-2px); background: rgba(255,255,255,.14); }
        .currency .top { display: flex; justify-content: space-between; gap: 8px; }
        .currency .name { color: rgba(255,255,255,.58); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .currency .value { margin-top: 12px; font-size: 21px; font-weight: 650; }
        .empty { padding: 50px; color: rgba(255,255,255,.55); text-align: center; }
        @media (max-width: 700px) { nav a { padding: 7px 9px; } #app { padding-inline: 15px; } header { align-items: stretch; flex-direction: column; } .hero { grid-template-columns: 1fr; } .chart { height: 330px; } }
    </style>
</head>

<body>
    <nav><a href="/weather">天气</a><a class="active" href="/fx">外汇</a><a href="/fund">基金</a><a href="/gold">黄金</a></nav>
    <div id="app">
        <header>
            <div><h1>外汇实时牌价</h1><div class="sub">招商银行牌价 · 100 单位外币兑人民币</div></div>
            <select v-model="selectedCode"><option v-for="item in latestRows" :key="item.code" :value="item.code">{{ item.code }} · {{ item.name }}</option></select>
        </header>

        <template v-if="selected">
            <section class="panel hero">
                <div><div class="hero-name">{{ selected.name }}</div><div class="hero-code">{{ selected.code }} / CNY</div><div class="updated">更新时间 {{ selected.ts }}</div></div>
                <div class="quotes">
                    <div class="quote"><strong>{{ number(selected.spot_bid) }}</strong><span>现汇买入</span></div>
                    <div class="quote"><strong>{{ number(selected.spot_ask) }}</strong><span>现汇卖出</span></div>
                    <div class="quote"><strong>{{ number(selected.cash_bid) }}</strong><span>现钞买入</span></div>
                    <div class="quote"><strong>{{ number(selected.cash_ask) }}</strong><span>现钞卖出</span></div>
                </div>
            </section>
            <div id="fxChart" class="panel chart"></div>
            <div class="list-title">全部币种</div>
            <div class="currency-list">
                <div v-for="item in latestRows" :key="item.code" class="panel currency" :class="{ selected: item.code === selectedCode }" @click="selectedCode = item.code">
                    <div class="top"><strong>{{ item.code }}</strong><span class="name">{{ item.name }}</span></div>
                    <div class="value">{{ number(item.spot_ask) }}</div><div class="updated">现汇卖出</div>
                </div>
            </div>
        </template>
        <div v-else class="panel empty">{{ error || '暂无外汇数据' }}</div>
    </div>

    <script>
        const { createApp, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;
        createApp({ setup() {
            const latestRows = ref([]), todayRows = ref([]), selectedCode = ref('USD'), error = ref('');
            const selected = computed(() => latestRows.value.find(row => row.code === selectedCode.value) || latestRows.value[0]);
            let chart = null, timer = null;
            const number = value => value == null ? '--' : Number(value).toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
            const time = value => value ? value.slice(11, 16) : '--';
            function render() {
                if (!chart) return;
                const rows = todayRows.value.filter(row => row.code === selectedCode.value);
                chart.setOption({
                    title: { text: `${selectedCode.value} 今日走势`, left: 'center', textStyle: { color: '#fff', fontSize: 16 } },
                    tooltip: { trigger: 'axis' }, legend: { bottom: 0, textStyle: { color: 'rgba(255,255,255,.7)' } },
                    grid: { left: 52, right: 24, top: 48, bottom: 48 },
                    xAxis: { type: 'category', boundaryGap: false, data: rows.map(row => time(row.ts)), axisLabel: { color: 'rgba(255,255,255,.55)' }, axisLine: { lineStyle: { color: 'rgba(255,255,255,.18)' } } },
                    yAxis: { type: 'value', scale: true, axisLabel: { color: 'rgba(255,255,255,.55)' }, splitLine: { lineStyle: { color: 'rgba(255,255,255,.1)' } } },
                    series: [
                        { name: '现汇买入', type: 'line', smooth: true, showSymbol: false, data: rows.map(row => row.spot_bid), lineStyle: { color: '#55d6be' } },
                        { name: '现汇卖出', type: 'line', smooth: true, showSymbol: false, data: rows.map(row => row.spot_ask), lineStyle: { color: '#ffcb77' } },
                        { name: '现钞买入', type: 'line', smooth: true, showSymbol: false, data: rows.map(row => row.cash_bid), lineStyle: { color: '#8ab4f8' } },
                        { name: '现钞卖出', type: 'line', smooth: true, showSymbol: false, data: rows.map(row => row.cash_ask), lineStyle: { color: '#f78fb3' } },
                    ],
                }, true);
            }
            async function load() {
                try {
                    const [latestResponse, todayResponse] = await Promise.all([fetch('/fx/now'), fetch('/fx/today')]);
                    if (!latestResponse.ok || !todayResponse.ok) throw new Error('接口请求失败');
                    latestRows.value = await latestResponse.json(); todayRows.value = await todayResponse.json();
                    if (!latestRows.value.some(row => row.code === selectedCode.value) && latestRows.value.length) selectedCode.value = latestRows.value[0].code;
                    error.value = '';
                    await nextTick();
                    if (!chart) chart = echarts.init(document.getElementById('fxChart'));
                    render();
                } catch (e) { error.value = `加载失败：${e.message}`; }
            }
            watch(selectedCode, render);
            const resize = () => chart && chart.resize();
            onMounted(async () => { window.addEventListener('resize', resize); await load(); timer = setInterval(load, 60000); });
            onBeforeUnmount(() => { clearInterval(timer); window.removeEventListener('resize', resize); chart && chart.dispose(); });
            return { latestRows, selectedCode, selected, error, number };
        }}).mount('#app');
    </script>
</body>
</html>

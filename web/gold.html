<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时贵金属价格</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.39/dist/vue.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; color: #fffaf0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(circle at 80% 8%, #76572a 0, transparent 34%), linear-gradient(145deg, #181711, #302719 65%, #392615); }
        nav { position: fixed; z-index: 10; top: 18px; left: 50%; display: flex; gap: 6px; padding: 6px; transform: translateX(-50%); border: 1px solid rgba(255,242,205,.14); border-radius: 999px; background: rgba(24,19,10,.65); backdrop-filter: blur(14px); }
        nav a { padding: 8px 14px; color: rgba(255,250,235,.65); font-size: 13px; text-decoration: none; border-radius: 999px; } nav a.active, nav a:hover { color: #fff; background: rgba(255,225,157,.13); }
        #app { width: min(1050px, 100%); min-height: 100vh; margin: auto; padding: 96px 24px 42px; }
        header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 24px; } h1 { font-size: clamp(29px, 5vw, 46px); letter-spacing: -.04em; } .sub, .muted { color: rgba(255,250,235,.52); font-size: 13px; }
        select { min-width: 180px; padding: 11px 14px; color: #fff9e9; border: 1px solid rgba(255,230,170,.2); border-radius: 12px; outline: none; background: #40331f; }
        .panel { border: 1px solid rgba(255,230,170,.14); border-radius: 22px; background: rgba(255,234,188,.07); box-shadow: 0 20px 50px rgba(0,0,0,.24); backdrop-filter: blur(14px); }
        .hero { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 30px; } .symbol { font-size: 15px; color: #e8c675; } .price { margin: 5px 0; font-size: clamp(44px, 8vw, 70px); font-weight: 700; letter-spacing: -.04em; } .unit { font-size: 15px; font-weight: 400; color: rgba(255,250,235,.5); }
        .stamp { text-align: right; line-height: 1.8; } .chart { height: 410px; margin-top: 22px; padding: 12px; }
        .list-title { margin: 30px 0 12px; color: rgba(255,250,235,.58); font-size: 14px; } .gold-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 12px; }
        .gold-item { padding: 17px; cursor: pointer; transition: .18s; } .gold-item:hover, .gold-item.selected { transform: translateY(-2px); background: rgba(255,225,157,.13); } .gold-item strong { display: block; margin-top: 9px; color: #f6d786; font-size: 22px; }
        .empty { padding: 55px; text-align: center; color: rgba(255,250,235,.55); }
        @media (max-width: 650px) { nav a { padding: 7px 9px; } #app { padding-inline: 15px; } header { align-items: stretch; flex-direction: column; } .hero { align-items: flex-start; flex-direction: column; } .stamp { text-align: left; } .chart { height: 340px; } }
    </style>
</head>

<body>
    <nav><a href="/weather">天气</a><a href="/fx">外汇</a><a href="/fund">基金</a><a class="active" href="/gold">黄金</a></nav>
    <div id="app">
        <header><div><h1>贵金属实时行情</h1><div class="sub">上海黄金交易所 · 招商银行</div></div><select v-model="selectedCode"><option v-for="item in latestRows" :key="item.code" :value="item.code">{{ item.code }} · {{ metalName(item.code) }}</option></select></header>
        <template v-if="selected">
            <section class="panel hero"><div><div class="symbol">{{ selected.code }} · {{ metalName(selected.code) }}</div><div class="price">{{ number(selected.price) }} <span class="unit">{{ priceUnit(selected.code) }}</span></div></div><div class="stamp"><div>最新成交价</div><div class="muted">更新时间 {{ selected.ts }}</div></div></section>
            <div id="goldChart" class="panel chart"></div>
            <div class="list-title">全部贵金属品种</div><div class="gold-list"><div v-for="item in latestRows" :key="item.code" class="panel gold-item" :class="{ selected: item.code === selectedCode }" @click="selectedCode = item.code"><span class="muted">{{ item.code }} · {{ metalName(item.code) }}</span><strong>{{ number(item.price) }}</strong><span class="muted">{{ priceUnit(item.code) }}</span></div></div>
        </template>
        <div v-else class="panel empty">{{ error || '暂无黄金数据' }}</div>
    </div>
    <script>
        const { createApp, ref, computed, watch, nextTick, onMounted, onBeforeUnmount } = Vue;
        createApp({ setup() {
            const latestRows = ref([]), todayRows = ref([]), selectedCode = ref('AUTD'), error = ref(''); let chart = null, timer = null;
            const selected = computed(() => latestRows.value.find(row => row.code === selectedCode.value) || latestRows.value[0]);
            const number = value => value == null ? '--' : Number(value).toFixed(2); const time = value => value ? value.slice(11, 16) : '--';
            const isSilver = code => String(code || '').toUpperCase() === 'AGTD';
            const metalName = code => isSilver(code) ? '白银' : '黄金';
            const priceUnit = code => isSilver(code) ? '元/千克' : '元/克';
            function render() { if (!chart) return; const rows = todayRows.value.filter(row => row.code === selectedCode.value); chart.setOption({ title: { text: `${selectedCode.value} ${metalName(selectedCode.value)}今日走势`, left: 'center', textStyle: { color: '#fffaf0', fontSize: 16 } }, tooltip: { trigger: 'axis', valueFormatter: value => `${value} ${priceUnit(selectedCode.value)}` }, grid: { left: 62, right: 24, top: 52, bottom: 40 }, xAxis: { type: 'category', boundaryGap: false, data: rows.map(row => time(row.ts)), axisLabel: { color: 'rgba(255,250,235,.52)' }, axisLine: { lineStyle: { color: 'rgba(255,230,170,.18)' } } }, yAxis: { type: 'value', scale: true, axisLabel: { color: 'rgba(255,250,235,.52)' }, splitLine: { lineStyle: { color: 'rgba(255,230,170,.1)' } } }, series: [{ name: '价格', type: 'line', smooth: true, showSymbol: false, data: rows.map(row => row.price), lineStyle: { width: 3, color: '#e6bd5a' }, areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(230,189,90,.35)' }, { offset: 1, color: 'rgba(230,189,90,0)' }] } } }] }, true); }
            async function load() { try { const [a, b] = await Promise.all([fetch('/gold/now'), fetch('/gold/today')]); if (!a.ok || !b.ok) throw new Error('接口请求失败'); latestRows.value = await a.json(); todayRows.value = await b.json(); if (!latestRows.value.some(row => row.code === selectedCode.value) && latestRows.value.length) selectedCode.value = latestRows.value[0].code; error.value = ''; await nextTick(); if (!chart) chart = echarts.init(document.getElementById('goldChart')); render(); } catch (e) { error.value = `加载失败：${e.message}`; } }
            watch(selectedCode, render); const resize = () => chart && chart.resize(); onMounted(async () => { window.addEventListener('resize', resize); await load(); timer = setInterval(load, 60000); }); onBeforeUnmount(() => { clearInterval(timer); window.removeEventListener('resize', resize); chart && chart.dispose(); });
            return { latestRows, selectedCode, selected, error, number, metalName, priceUnit };
        }}).mount('#app');
    </script>
</body>
</html>
